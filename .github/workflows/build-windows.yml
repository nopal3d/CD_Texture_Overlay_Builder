name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare fonts
        shell: cmd
        run: call PREPARE_NOTO_SANS_WINDOWS.bat

      - name: Build and test runtime plugin
        shell: cmd
        run: call Runtime\build.bat test

      - name: Publish EXE
        shell: cmd
        run: dotnet publish HDOverlayBuilder.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=none -p:DebugSymbols=false -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HD_Overlay_Builder_Windows
          path: |
            publish/HD Overlay Builder.exe
            README.md
            THIRD_PARTY_NOTICES.md
