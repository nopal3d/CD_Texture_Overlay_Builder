name: Build Windows ONEDIR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Build native helper
        shell: cmd
        run: BUILD_NATIVE_C_HELPER.bat

      - name: Test native helper
        shell: cmd
        run: TEST_FAST_HASH_HELPER.bat

      - name: Build PyInstaller ONEDIR
        shell: cmd
        run: BUILD_WINDOWS_EXE.bat

      - name: Package release zip
        shell: cmd
        run: PACKAGE_RELEASE_ZIP.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CD_Texture_Overlay_Builder_Windows_ONEDIR
          path: |
            CD_Texture_Overlay_Builder_v1.2.5_Portable_ONEDIR.zip
            CD_Texture_Overlay_Builder_v1.2.5_Portable_ONEDIR.zip.sha256
            dist/CD_Texture_Overlay_Builder/SHA256SUMS.txt
